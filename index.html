<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>dokey page</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: #f7f9f8;
      color: #222;
      line-height: 1.7;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2.4rem;
    }

    .lead {
      color: #666;
      margin-bottom: 56px;
    }

    h2 {
      margin-top: 48px;
      padding-bottom: 8px;
      font-size: 1.4rem;
      border-bottom: 1px solid #e6ebe8;
    }

    .app-card {
      margin-top: 24px;
      padding: 28px;
      background: #fff;
      border: 1px solid #e6ebe8;
      border-radius: 14px;
    }

    .app-card h3 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    a {
      color: #157f70;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid #e6ebe8;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>dokey page</h1>
    <p class="lead">
      暮らしを少し便利にするアプリを、個人で開発しています。
    </p>

    <h2>Apps</h2>

    <section class="app-card">
      <h3>Kiwi AppWatch</h3>

      <p>
        スマートフォンやアプリの使用時間を見える化し、
        自分の時間の使い方を振り返るためのAndroidアプリです。
      </p>

      <div class="links">
        <a href="/kiwi-appwatch/">Kiwi AppWatchについて</a>
        <a href="/kiwi-appwatch/privacy/">プライバシーポリシー</a>
      </div>
    </section>

    <h2>Contact</h2>

    <p>
      アプリに関するお問い合わせは、
      <a href="mailto:support@dokeypage.com">
        support@dokeypage.com
      </a>
      までお願いいたします。
    </p>

    <footer>
      © dokey page
    </footer>
  </main>
</body>
</html>
